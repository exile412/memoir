<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131313">
<title>memoir · 记忆</title>
<link rel="stylesheet" href="/static/style.css?v=062">
</head>
<body>
<div class="wallpaper-layer" id="wpLayer"></div>

<div class="auth-layer" id="authLayer">
  <div class="auth-card">
    <div class="auth-logo">◈</div>
    <h2>memoir</h2>
    <p class="auth-sub" id="authSub">请输入访问密码</p>
    <input type="password" id="authPwd" placeholder="访问密码" autocomplete="current-password">
    <input type="password" id="authPwd2" placeholder="再输一次" autocomplete="new-password" style="display:none">
    <button class="auth-btn" id="authBtn">进入</button>
    <p class="auth-note" id="authNote"></p>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">◈</div>
    <div class="brand-text"><b>memoir</b><span>记忆</span></div>
  </div>

  <button class="new-btn" id="newBtn">
    <span class="plus">＋</span> 新的记录
  </button>

  <div class="list-head">
    <span>记录</span>
    <em id="listCount">0 条</em>
  </div>
  <div class="list" id="list"></div>

  <div class="side-foot">
    <button class="foot-btn" data-act="review"><i>▤</i>生成复盘</button>
    <button class="foot-btn" data-act="persona"><i>◍</i>人格档案</button>
    <button class="foot-btn" data-act="settings"><i>⚙</i>设置</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">☰</button>
    <h1 id="pageTitle">记忆库</h1>
    <div class="top-actions">
      <input class="search" id="search" placeholder="搜索记忆…" autocomplete="off">
    </div>
  </header>

  <div class="reminder" id="reminder">
    <span>今天还没复盘</span>
    <button class="reminder-btn" id="reminderGo">现在生成</button>
    <button class="reminder-close" id="reminderClose">稍后</button>
  </div>

  <section class="chat" id="chat"></section>

  <footer class="composer" id="composer">
    <div class="composer-tools">
      <select class="pill" id="kind" title="类型">
        <option value="event">事件</option>
        <option value="thought">想法</option>
        <option value="feeling">情绪</option>
        <option value="note">备注</option>
      </select>
      <select class="pill" id="mode" title="保存方式">
        <option value="raw">原样保存</option>
        <option value="polished">文笔美化</option>
        <option value="organized">AI 整理</option>
      </select>
      <button class="pill toggle" id="titleToggle" data-on="1">自动标题</button>
      <span class="grow"></span>
      <button class="pill" id="groupBtn" title="选择分组">分组</button>
    </div>
    <textarea id="input" rows="1" enterkeyhint="send" placeholder="今天想要记录什么？"></textarea>
    <div class="composer-actions">
      <span class="hint" id="hint"></span>
    </div>
    <button class="send" id="sendBtn">发送</button>
  </footer>
</main>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <b>设置</b>
    <button class="icon-btn" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body">
    <section class="sec" id="accountSec">
      <h3>账号</h3>
      <div id="accGuest">
        <label>邮箱<input id="accEmail" type="email" placeholder="you@example.com" autocomplete="username"></label>
        <label>密码<input id="accPwd" type="password" placeholder="至少 6 位" autocomplete="current-password"></label>
        <div class="row-actions">
          <button class="btn primary" id="accLogin">登录</button>
          <button class="btn" id="accRegister">注册</button>
        </div>
        <p class="note" id="accNote">邮箱只当账号用，不会发验证邮件。不想注册也能直接用。</p>
      </div>
      <div id="accUser" style="display:none">
        <div class="acc-head">
          <div class="acc-avatar" id="accAvatar">◈</div>
          <div class="acc-info">
            <b id="accName">—</b>
            <p class="note" id="accMail"></p>
          </div>
        </div>
        <div class="row-actions">
          <button class="btn primary" id="accProfile">个人主页</button>
          <button class="btn" id="accLogout">退出</button>
        </div>
      </div>
    </section>

    <section class="sec">
      <h3>模型</h3>
      <label>接口地址<input id="setBaseUrl" placeholder="http://127.0.0.1:11434/v1"></label>
      <label>模型名<input id="setModel" placeholder="qwen3-8b-zh-fast:latest"></label>
      <label>API Key<input id="setKey" placeholder="本地模型留空"></label>
      <div class="row2">
        <label>温度<input id="setTemp" type="number" step="0.1" min="0" max="2"></label>
        <label>超时(秒)<input id="setTimeout" type="number" min="10"></label>
      </div>
      <div class="row-actions">
        <button class="btn primary" id="saveSettings">保存</button>
        <button class="btn" id="testModel">测试连接</button>
      </div>
      <p class="note" id="modelNote"></p>
    </section>

    <section class="sec">
      <h3>壁纸</h3>
      <p class="note">自动读取 Wallpaper Engine 创意工坊目录，也可以手动指定一个图片文件夹。</p>
      <label>壁纸目录<input id="setWallpaperDir" placeholder="留空则自动探测"></label>
      <div class="row-actions">
        <button class="btn" id="reloadWallpapers">刷新列表</button>
        <button class="btn" id="clearWallpaper">清除背景</button>
        <button class="btn" id="launchWE">启动壁纸引擎</button>
      </div>
      <label style="margin-top:12px">壁纸亮度 <span id="wpVal" class="note" style="display:inline"></span>
        <input type="range" id="wpBright" min="30" max="100" value="68" style="height:auto;padding:0">
      </label>
      <div class="wall-grid" id="wallGrid"></div>
    </section>

    <section class="sec">
      <h3>记事本</h3>
      <p class="note">记忆会写成每天一个 .md 文件，可以直接用记事本改。改完点「同步回库」。</p>
      <div class="row-actions">
        <button class="btn" id="notesOpen">打开笔记文件夹</button>
        <button class="btn" id="notesExport">导出全部</button>
        <button class="btn primary" id="notesSync">同步回库</button>
      </div>
      <p class="note" id="notesNote"></p>
    </section>

    <section class="sec">
      <h3>数据</h3>
      <div class="row-actions">
        <button class="btn" id="exportBtn">导出全部</button>
        <button class="btn" id="refreshBtn">刷新</button>
      </div>
      <p class="note" id="dataNote"></p>
    </section>
  </div>
</div>

<div class="profile-layer" id="profileLayer">
  <div class="profile-card">
    <button class="icon-btn" id="profileClose" style="position:absolute;right:14px;top:14px">✕</button>
    <div class="profile-avatar" id="pAvatar">◈</div>
    <h2 id="pName">—</h2>
    <p class="profile-bio" id="pBio">还没有写简介</p>
    <div class="profile-stats" id="pStats"></div>
    <div class="profile-edit">
      <input id="pEditName" placeholder="昵称" maxlength="24">
      <input id="pEditBio" placeholder="一句话简介" maxlength="120">
      <button class="btn primary" id="pSave">保存</button>
    </div>
  </div>
</div>

<script src="/static/syntax.js?v=061"></script>
<script src="/static/app.js?v=061"></script>
</body>
</html>
